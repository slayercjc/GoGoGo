name: Android 16 build

on:
  push:
    branches:
      - android16-baidu
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      mode:
        description: "check = compile only; signed-apk = build an installable APK"
        required: true
        default: check
        type: choice
        options:
          - check
          - signed-apk

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Validate signing inputs
        if: inputs.mode == 'signed-apk' || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[signed-apk]'))
        shell: bash
        env:
          BAIDU_MAP_AK: ${{ secrets.BAIDU_MAP_AK }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in BAIDU_MAP_AK ANDROID_KEYSTORE_BASE64 ANDROID_STORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret: $name"
              exit 1
            fi
          done
      - name: Compile, unit tests and lint
        env:
          BAIDU_MAP_AK: ${{ secrets.BAIDU_MAP_AK }}
        run: bash ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
      - name: Build release
        if: inputs.mode == 'signed-apk' || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[signed-apk]'))
        env:
          BAIDU_MAP_AK: ${{ secrets.BAIDU_MAP_AK }}
        run: bash ./gradlew --no-daemon :app:assembleRelease
      - name: Sign and verify APK
        if: inputs.mode == 'signed-apk' || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[signed-apk]'))
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          keyfile="$RUNNER_TEMP/gogogo-signing.jks"
          trap 'rm -f "$keyfile"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keyfile"
          mkdir -p dist
          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*.apk)
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one release APK"
            exit 1
          fi
          tools="$ANDROID_HOME/build-tools/35.0.0"
          "$tools/zipalign" -P 16 -f 4 "${apks[0]}" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" sign --ks "$keyfile" --ks-key-alias "$ANDROID_KEY_ALIAS" --ks-pass env:ANDROID_STORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD --out dist/HuanWei.apk "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" verify --verbose --print-certs dist/HuanWei.apk > dist/signature-report.txt
          "$tools/zipalign" -c -P 16 -v 4 dist/HuanWei.apk > dist/zip-alignment.txt
          grep -i 'certificate SHA-1 digest: cd6a44cd781be47f1490675e24e82759c900595b' dist/signature-report.txt
          python scripts/create_update_manifest.py dist/HuanWei.apk "$tools/aapt"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version=$(python -c 'import json; print(json.load(open("dist/update.json"))["versionName"])')
            if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
              echo "::error::Tag does not match APK versionName"
              exit 1
            fi
          fi
      - name: Upload signed APK
        if: inputs.mode == 'signed-apk' || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[signed-apk]'))
        uses: actions/upload-artifact@v4
        with:
          name: HuanWei-signed
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-reports
          path: app/build/reports/
          if-no-files-found: ignore
          retention-days: 14


  publish:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-release]'))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: HuanWei-signed
          path: dist
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=$(python -c 'import json; print(json.load(open("dist/update.json"))["versionName"])')
          tag="v$version"
          if [[ "$GITHUB_REF" == refs/tags/* && "$RELEASE_TAG" != "$tag" ]]; then
            echo "::error::Release tag does not match APK version"
            exit 1
          fi
          (cd dist && sha256sum --check SHA256SUMS.txt)
          cat > release-notes.md <<'NOTES'
          ## 幻位
          安装下方 HuanWei 开头的 APK 即可。同一签名可直接覆盖旧版，保留设置和历史记录。
          
          ### 1.1.4 修复
          - 修正隐私政策和用户协议弹窗中的“同意并继续”按钮换行问题。
          - 两个操作按钮均分可用宽度，缩小内边距并保持单行显示，保留原有同意与拒绝行为。
          - 保留设置页顶部遮挡修复和首次进入页优化。
          
          APK 已通过编译、单元测试、Lint 和签名验证；不同设备仍需实际验证。
          
          update.json 和 SHA256SUMS.txt 用于自动更新及文件校验，普通用户只需下载 APK。
          源码基于 ZCShou/GoGoGo，保留 GPL-3.0 许可证与原作者声明。
          NOTES
          gh release create "$tag" dist/*.apk dist/update.json dist/SHA256SUMS.txt --target "$GITHUB_SHA" --notes-file release-notes.md --title "幻位 $version" --latest
